apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaderboard-app-sa
  annotations:
    iam.gke.io/gcp-service-account: leaderboard-app-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com # PLACEHOLDER

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtime-processor
  template:
    metadata:
      labels:
        app: realtime-processor
    spec:
      serviceAccountName: leaderboard-app-sa
      containers:
      - name: processor
        image: gcr.io/<GCP_PROJECT_ID>/leaderboard:latest # PLACEHOLDER
        command: ["python3", "src/processors/realtime_processor.py"]
        env:
        - name: PYTHONPATH
          value: /app/src
        envFrom:
        - configMapRef:
            name: leaderboard-config

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leaderboard-api
  template:
    metadata:
      labels:
        app: leaderboard-api
    spec:
      serviceAccountName: leaderboard-app-sa
      containers:
      - name: api
        image: gcr.io/<GCP_PROJECT_ID>/leaderboard:latest # PLACEHOLDER
        command: ["python3", "src/leaderboard_service/service.py"]
        ports:
        - containerPort: 8080
        env:
        - name: PYTHONPATH
          value: /app/src
        envFrom:
        - configMapRef:
            name: leaderboard-config

---

apiVersion: v1
kind: Service
metadata:
  name: leaderboard-api-service
spec:
  selector:
    app: leaderboard-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer

---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-processor
spec:
  schedule: "0 * * * *" # Run every hour
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: leaderboard-app-sa
          containers:
          - name: batch-processor
            image: gcr.io/<GCP_PROJECT_ID>/leaderboard:latest # PLACEHOLDER
            command: ["python3", "src/processors/batch_processor.py"]
            env:
            - name: PYTHONPATH
              value: /app/src
            envFrom:
            - configMapRef:
                name: leaderboard-config
          restartPolicy: OnFailure

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-publisher
  template:
    metadata:
      labels:
        app: event-publisher
    spec:
      serviceAccountName: leaderboard-app-sa
      containers:
      - name: publisher
        image: gcr.io/<GCP_PROJECT_ID>/leaderboard:latest # PLACEHOLDER
        command: ["python3", "src/event_publisher/publisher.py"]
        env:
        - name: PYTHONPATH
          value: /app/src
        envFrom:
        - configMapRef:
            name: leaderboard-config
