apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaderboard-app-sa
  annotations:
    iam.gke.io/return-principal-id-as-email: "true"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtime-processor
  template:
    metadata:
      labels:
        app: realtime-processor
    spec:
      serviceAccountName: leaderboard-app-sa
      containers:
      - name: processor
        image: gcr.io/aftermath-69/leaderboard:dccfd71
        command: ["python3", "src/processors/realtime_processor.py"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: PYTHONPATH
          value: /app/src
        envFrom:
        - configMapRef:
            name: leaderboard-config

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaderboard-api
  template:
    metadata:
      labels:
        app: leaderboard-api
    spec:
      serviceAccountName: leaderboard-app-sa
      containers:
      - name: api
        image: gcr.io/aftermath-69/leaderboard:dccfd71
        command: ["python3", "src/leaderboard_service/service.py"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        env:
        - name: PYTHONPATH
          value: /app/src
        envFrom:
        - configMapRef:
            name: leaderboard-config

---

apiVersion: v1
kind: Service
metadata:
  name: leaderboard-api-service
spec:
  selector:
    app: leaderboard-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-publisher
  template:
    metadata:
      labels:
        app: event-publisher
    spec:
      serviceAccountName: leaderboard-app-sa
      containers:
      - name: publisher
        image: gcr.io/aftermath-69/leaderboard:dccfd71 # PLACEHOLDER
        command: ["python3", "src/event_publisher/publisher.py"]
        env:
        - name: PYTHONPATH
          value: /app/src
        envFrom:
        - configMapRef:
            name: leaderboard-config